<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOLIDEO MUSIC COURSE</title>
<style>
:root{--ink:#1d1b2e;--mute:#6b6880;--bg:#f6f4fb;--card:#fff;--line:#e2deee;--brand:#3b2a8c;--brand2:#e8b53a;--ok:#1f7a4d;--err:#b3261e}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,"Times New Roman",serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:var(--brand);color:#fff;padding:18px 20px;border-bottom:4px solid var(--brand2)}
header h1{margin:0;font-size:1.25rem;letter-spacing:.04em}
header small{color:#d6d0f5;font-family:system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:1.2rem}
label{display:block;margin:12px 0 4px;font:600 .9rem system-ui,sans-serif}
input,select,textarea{width:100%;padding:11px;border:1px solid #bdb8d4;border-radius:6px;font:1rem system-ui,sans-serif;background:#fff}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--brand2);outline-offset:1px}
button{font:600 1rem system-ui,sans-serif;border:0;border-radius:6px;padding:11px 18px;cursor:pointer;background:var(--brand);color:#fff;margin-top:16px}
button.alt{background:#fff;color:var(--brand);border:1px solid var(--brand)}
button.sm{margin:0;padding:7px 12px;font-size:.9rem}
.msg{margin-top:12px;font:.95rem system-ui,sans-serif}.err{color:var(--err)}.ok{color:var(--ok)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-family:system-ui,sans-serif}
.row:first-of-type{border-top:0}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font:600 .8rem system-ui,sans-serif}
.wait{background:#fdf0cf;color:#7a5a00}.done{background:#d9f2e4;color:var(--ok)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
dl{margin:0;font-family:system-ui,sans-serif}dt{color:var(--mute);font-size:.85rem;margin-top:10px}dd{margin:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{margin:0;padding:8px 14px;font-size:.9rem;background:#fff;color:var(--brand);border:1px solid var(--brand)}
.tabs button.on{background:var(--brand);color:#fff}
.chk{display:flex;gap:8px;align-items:center;font-weight:400}.chk input{width:auto}
details{margin-top:10px;font-family:system-ui,sans-serif}summary{cursor:pointer;color:var(--brand);font-weight:600}
small{color:var(--mute)}
.scroll{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;min-width:560px}
.dh{text-align:center;font:600 .8rem system-ui,sans-serif;color:var(--mute);padding:4px}
.cel{margin:0;min-height:76px;padding:4px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:6px;font:400 .75rem system-ui,sans-serif;text-align:left;display:flex;flex-direction:column;gap:2px;align-items:stretch}
.cel b{font-size:.85rem}
.cel.out{background:#f1eef8;color:var(--mute)}
.cel.today{border:2px solid var(--brand2)}
.cel.sel{outline:3px solid var(--brand)}
.chip{background:#e6e1fa;border-radius:4px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.7rem}
.chip.more{background:var(--brand2)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
header h1{font-size:1.05rem}
.um{position:relative}
.av{width:38px;height:38px;border-radius:50%;background:var(--brand2);color:var(--ink);display:flex;align-items:center;justify-content:center;font:700 1rem system-ui,sans-serif;cursor:pointer;list-style:none;margin:0}
.av::-webkit-details-marker{display:none}
.menu{position:absolute;right:0;top:46px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:180px;z-index:5;font-family:system-ui,sans-serif}
.menu button{width:100%}
.sec>summary{font-weight:600;cursor:pointer;color:var(--brand);font-family:system-ui,sans-serif}
.sec[open]>summary{margin-bottom:10px}
.cal.sm{min-width:0}.cal.sm .cel{min-height:56px;padding:3px}
</style>
</head>
<body>
<header><h1>SOLIDEO MUSIC COURSE</h1><div id="hu"></div></header>
<main id="app"><div class="card">Memuat…</div></main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, collection, query, where, getDocs, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBzkDez2oSiD6dkpOpn4oHw6GM5E3ioZpk",
  authDomain: "solideo-music-course.firebaseapp.com",
  projectId: "solideo-music-course",
  storageBucket: "solideo-music-course.firebasestorage.app",
  messagingSenderId: "905695709090",
  appId: "1:905695709090:web:5f75bd671c499e6db414fb"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = (s) => document.querySelector(s);
const root = $("#app");
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let busy = false;

function errText(e) {
  const m = {
    "auth/invalid-credential": "Email atau password salah.",
    "auth/email-already-in-use": "Email ini sudah terdaftar. Silakan masuk.",
    "auth/weak-password": "Password minimal 6 karakter.",
    "auth/invalid-email": "Format email tidak valid.",
    "auth/network-request-failed": "Tidak ada koneksi internet.",
    "permission-denied": "Akses ditolak oleh aturan keamanan."
  };
  return m[e.code] || ("Terjadi kesalahan: " + (e.code || e.message));
}

function authView(mode = "masuk") {
  $("#hu").innerHTML = "";
  const daftar = mode === "daftar";
  root.innerHTML = `
  <div class="card">
    <h2>${daftar ? "Daftar akun baru" : "Masuk"}</h2>
    <form id="f" novalidate>
      ${daftar ? `
      <label for="role">Saya mendaftar sebagai</label>
      <select id="role"><option value="siswa">Siswa (atau orang tua siswa)</option><option value="guru">Guru</option></select>
      <label for="nama">Nama lengkap</label><input id="nama" autocomplete="name">` : ""}
      <label for="email">Email</label><input id="email" type="email" autocomplete="email">
      <label for="pw">Password</label><input id="pw" type="password" autocomplete="${daftar ? "new-password" : "current-password"}">
      ${daftar ? `<div id="extra"></div>` : ""}
      <button type="submit">${daftar ? "Daftar" : "Masuk"}</button>
      <div id="m" class="msg err" role="alert"></div>
    </form>
    <p class="msg">${daftar ? "Sudah punya akun?" : "Belum punya akun?"} <a href="#" id="sw">${daftar ? "Masuk" : "Daftar di sini"}</a></p>
  </div>`;
  $("#sw").onclick = (e) => { e.preventDefault(); authView(daftar ? "masuk" : "daftar"); };
  if (daftar) {
    const draw = () => {
      $("#extra").innerHTML = $("#role").value === "guru"
        ? `<label for="hp">No. HP</label><input id="hp" type="tel">`
        : `<label for="pgl">Nama panggilan siswa</label><input id="pgl">
           <label for="tl">Tanggal lahir siswa</label><input id="tl" type="date">
           <label for="ortu">Nama orang tua</label><input id="ortu">
           <label for="hpo">No. HP orang tua</label><input id="hpo" type="tel">
           <label for="hps">No. HP siswa (boleh kosong)</label><input id="hps" type="tel">
           <label for="almt">Alamat (boleh kosong)</label><input id="almt">`;
    };
    $("#role").onchange = draw; draw();
  }
  $("#f").onsubmit = async (e) => {
    e.preventDefault();
    const m = $("#m"); m.textContent = "";
    const email = $("#email").value.trim(), pw = $("#pw").value;
    try {
      if (!daftar) { await signInWithEmailAndPassword(auth, email, pw); return; }
      const role = $("#role").value, nama = $("#nama").value.trim();
      if (!nama || !email || !pw) { m.textContent = "Nama, email, dan password wajib diisi."; return; }
      let data;
      if (role === "guru") {
        const hp = $("#hp").value.trim();
        if (!hp) { m.textContent = "No. HP wajib diisi."; return; }
        data = { nama_lengkap: nama, no_hp: hp, program_diajarkan: [] };
      } else {
        const v = (id) => $("#" + id).value.trim();
        if (!v("tl") || !v("ortu") || !v("hpo")) { m.textContent = "Tanggal lahir, nama orang tua, dan No. HP orang tua wajib diisi."; return; }
        data = { nama_lengkap: nama, nama_panggilan: v("pgl"), tanggal_lahir: v("tl"), nama_orangtua: v("ortu"),
                 no_hp_orangtua: v("hpo"), no_hp_siswa: v("hps"), alamat: v("almt"), catatan_khusus: "" };
      }
      busy = true;
      const cred = await createUserWithEmailAndPassword(auth, email, pw);
      const uid = cred.user.uid;
      await setDoc(doc(db, "users", uid), { email, role, nama, status: "aktif", created_at: serverTimestamp() });
      await setDoc(doc(db, role, uid), { ...data, uid, status_verifikasi: "menunggu", status: "aktif",
        created_at: serverTimestamp(), updated_at: serverTimestamp() });
      busy = false;
      await showHome(cred.user);
    } catch (err) { busy = false; m.textContent = errText(err); }
  };
}

function profileView(role, p) {
  const f = role === "guru"
    ? [["Nama lengkap", p.nama_lengkap], ["No. HP", p.no_hp]]
    : [["Nama lengkap", p.nama_lengkap], ["Nama panggilan", p.nama_panggilan], ["Tanggal lahir", p.tanggal_lahir],
       ["Nama orang tua", p.nama_orangtua], ["No. HP orang tua", p.no_hp_orangtua], ["No. HP siswa", p.no_hp_siswa], ["Alamat", p.alamat]];
  const ok = p.status_verifikasi === "terverifikasi";
  return `<details class="card sec" ${ok ? "" : "open"}><summary>Data saya · <span class="badge ${ok ? "done" : "wait"}">${ok ? "Terverifikasi" : "Menunggu verifikasi admin"}</span></summary>
    <dl>${f.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v) || "-"}</dd>`).join("")}</dl></details>`;
}

const rp = (n) => "Rp " + Number(n).toLocaleString("id-ID");
function setHeader(nama, role) {
  $("#hu").innerHTML = `<details class="um"><summary class="av" title="${esc(nama)}">${esc((nama || "?").trim().charAt(0).toUpperCase())}</summary>
    <div class="menu"><strong>${esc(nama)}</strong><br><small style="color:var(--mute)">${esc(role)}</small><button id="out" class="alt sm">Keluar</button></div></details>`;
}
const topBar = (nama, role) => { setHeader(nama, role); return ""; };
let adminTab = "verif";
const HARI = ["minggu", "senin", "selasa", "rabu", "kamis", "jumat", "sabtu"];
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const monday = (d) => addDays(d, -((d.getDay() + 6) % 7));
const jamAkhir = (j, m) => { const [h, mi] = j.split(":").map(Number); const t = h * 60 + mi + m; return pad(Math.floor(t / 60) % 24) + ":" + pad(t % 60); };
const tglLabel = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long" }); };
let weekStart = monday(new Date()), guruFilter = "", calMode = "minggu", selDay = ymd(new Date());

async function generate(polas) {
  const snapF = await getDocs(query(collection(db, "jadwal"), where("tanggal", ">=", ymd(new Date()))));
  const have = new Set(snapF.docs.map((d) => d.id));
  const libur = snapF.docs.filter((d) => { const x = d.data(); return x.tipe === "reguler" && x.status === "terjadwal" && Number(x.tanggal.slice(8)) >= 29; });
  for (let i = 0; i < libur.length; i += 400) { const b = writeBatch(db); libur.slice(i, i + 400).forEach((d) => b.delete(d.ref)); await b.commit(); }
  const endStr = ymd(addDays(new Date(), 90)), writes = [];
  for (const p of polas.filter((x) => x.status === "aktif")) {
    const hari = HARI.indexOf(p.hari);
    for (let d = new Date(); ymd(d) <= endStr; d = addDays(d, 1)) {
      const ds = ymd(d), id = p.id + "_" + ds;
      if (d.getDay() !== hari || ds < p.tanggal_mulai || have.has(id) || d.getDate() >= 29) continue;
      writes.push([id, { polaId: p.id, siswaId: p.siswaId, programId: p.programId, guruId: p.guruId, nama_siswa: p.nama_siswa,
        nama_program: p.nama_program, nama_guru: p.nama_guru, tanggal: ds, jam_mulai: p.jam_mulai, durasi_menit: p.durasi_menit,
        tipe: "reguler", status: "terjadwal", created_at: serverTimestamp(), updated_at: serverTimestamp() }]);
    }
  }
  for (let i = 0; i < writes.length; i += 400) {
    const b = writeBatch(db);
    writes.slice(i, i + 400).forEach(([id, x]) => b.set(doc(db, "jadwal", id), x));
    await b.commit();
  }
  return writes.length;
}

async function closePola(p) {
  const t = ymd(new Date());
  await updateDoc(doc(db, "pola_jadwal", p.id), { status: "berhenti", updated_at: serverTimestamp() });
  const s = await getDocs(query(collection(db, "jadwal"), where("polaId", "==", p.id)));
  const b = writeBatch(db);
  s.docs.filter((d) => d.data().tanggal >= t && d.data().status === "terjadwal")
    .forEach((d) => b.update(d.ref, { status: "dibatalkan", updated_at: serverTimestamp() }));
  await b.commit();
}

const STATUS_ABS = ["hadir", "tidak_hadir", "izin", "sakit", "reschedule"];

function sesiBox(j, role, A, C, gurus) {
  const t = ymd(new Date()), a = A[j.id], c = C[j.id], staff = role === "guru" || role === "admin";
  const live = j.status !== "dibatalkan" && j.status !== "digantikan";
  let o = a ? `<small>Absensi: <b>${esc(a.status)}</b>${c && c.materi ? " · Materi: " + esc(c.materi) : ""}</small>` : "";
  if (staff && live && j.tanggal <= t) o += `<details><summary>${a ? "Ubah absensi" : "Isi absensi"}</summary><div class="ab" data-j="${j.id}">
    <label>Status</label><select class="as">${STATUS_ABS.map((x) => `<option ${a && a.status === x ? "selected" : ""}>${x}</option>`).join("")}</select>
    <label>Catatan (boleh kosong)</label><input class="ac" value="${esc(a && a.catatan)}">
    <label>Materi yang diajarkan</label><textarea class="am" rows="2">${esc(c && c.materi)}</textarea>
    <label>PR (boleh kosong)</label><textarea class="ap" rows="2">${esc(c && c.pr)}</textarea>
    <label>Tenggat PR (boleh kosong)</label><input class="at" type="date" value="${esc(c && c.pr_tenggat)}">
    <button class="sm" data-act="saveabs" data-id="${j.id}">Simpan absensi</button></div></details>`;
  if (staff && j.status === "terjadwal" && j.tanggal >= t) o += `<details><summary>Pindah jadwal${role === "admin" ? " / ganti guru" : ""}</summary><div class="rs" data-j="${j.id}">
    <label>Jenis</label><select class="rj"><option value="ganti_waktu">Ganti waktu</option>${role === "admin" ? `<option value="ganti_guru">Ganti guru</option>` : ""}</select>
    ${role === "admin" ? `<label>Guru pengganti (jika ganti guru)</label><select class="rg">${gurus.map((g) => `<option value="${g.id}">${esc(g.nama_lengkap)}</option>`).join("")}</select>` : ""}
    <label>Tanggal baru</label><input class="rd" type="date" value="${j.tanggal}"><label>Jam baru</label><input class="rt" type="time" value="${j.jam_mulai}">
    <button class="sm" data-act="applyres" data-id="${j.id}">Terapkan</button></div></details>`;
  if (role === "siswa" && j.status === "terjadwal" && j.tanggal > t) o += `<details><summary>Ajukan reschedule</summary><div class="rq" data-j="${j.id}">
    <label>Yang diminta</label><select class="rj"><option value="ganti_waktu">Ganti waktu</option><option value="ganti_guru">Ganti guru</option></select>
    <label>Alasan</label><input class="qa"><label>Usul tanggal baru (boleh kosong)</label><input class="rd" type="date"><label>Usul jam baru (boleh kosong)</label><input class="rt" type="time">
    <button class="sm" data-act="reqres" data-id="${j.id}">Kirim pengajuan</button></div></details>`;
  return o;
}

function reqCard(r, role, gurus) {
  const open = r.status === "menunggu", proc = open && (role === "admin" || (role === "guru" && r.jenis === "ganti_waktu"));
  const gl = gurus.filter((g) => g.id !== r.guruId && (g.program_diajarkan || []).includes(r.programId));
  let o = `<div class="row" style="display:block"><div class="top"><strong>${esc(r.nama_siswa)}</strong><span class="badge ${r.status === "disetujui" ? "done" : "wait"}">${esc(r.status)}</span></div>
    <small>${esc(r.nama_program)} · ${tglLabel(r.tanggal_asal)} ${esc(r.jam_asal)} · ${r.jenis === "ganti_guru" ? "minta ganti guru" : "minta ganti waktu"}${r.alasan ? " · " + esc(r.alasan) : ""}</small>`;
  if (r.status === "disetujui") o += `<br><small>Jadwal baru: ${tglLabel(r.tanggal_baru)} ${esc(r.jam_baru)}${r.nama_guru_pengganti ? " · " + esc(r.nama_guru_pengganti) : ""}</small>`;
  if (proc) o += `<details><summary>Proses</summary><div class="ap2" data-r="${r.id}">
    ${role === "admin" && r.jenis === "ganti_guru" ? `<label>Guru pengganti</label><select class="rg">${(gl.length ? gl : gurus).map((g) => `<option value="${g.id}">${esc(g.nama_lengkap)}</option>`).join("")}</select>` : ""}
    <label>Tanggal baru</label><input class="rd" type="date" value="${esc(r.tanggal_baru || r.tanggal_asal)}"><label>Jam baru</label><input class="rt" type="time" value="${esc(r.jam_baru || r.jam_asal)}">
    <button class="sm" data-act="approve" data-id="${r.id}">Setujui</button> <button class="alt sm" data-act="reject" data-id="${r.id}">Tolak</button></div></details>`;
  else if (open) o += `<br><small>Menunggu admin mencarikan guru pengganti.</small>`;
  return o + "</div>";
}

async function applyResched(j, jenis, tgl, jam, g, uid, reqId) {
  const u = serverTimestamp(), b = writeBatch(db);
  b.set(doc(collection(db, "jadwal")), { siswaId: j.siswaId, programId: j.programId, guruId: g ? g.id : j.guruId, nama_siswa: j.nama_siswa,
    nama_program: j.nama_program, nama_guru: g ? g.nama_lengkap : j.nama_guru, tanggal: tgl, jam_mulai: jam, durasi_menit: j.durasi_menit,
    tipe: g ? "pengganti" : "reschedule", jadwal_asal_id: j.id, status: "terjadwal", created_at: u, updated_at: u });
  b.update(doc(db, "jadwal", j.id), { status: "digantikan", updated_at: u });
  const rd = { jenis, status: "disetujui", guru_pengganti_id: g ? g.id : "", nama_guru_pengganti: g ? g.nama_lengkap : "", tanggal_baru: tgl, jam_baru: jam, disetujui_oleh: uid, updated_at: u };
  if (reqId) b.update(doc(db, "reschedule", reqId), rd);
  else b.set(doc(collection(db, "reschedule")), { ...rd, jadwal_asal_id: j.id, siswaId: j.siswaId, guruId: j.guruId, programId: j.programId, nama_siswa: j.nama_siswa,
    nama_program: j.nama_program, nama_guru: j.nama_guru, tanggal_asal: j.tanggal, jam_asal: j.jam_mulai, diajukan_oleh: uid, alasan: "", created_at: u });
  await b.commit();
}

async function sesiAction(a, id, btn, ctx) {
  const jd = async (jid) => ({ id: jid, ...(await getDoc(doc(db, "jadwal", jid))).data() });
  const v = (box, s) => box.querySelector(s).value.trim();
  const u = serverTimestamp();
  if (a === "saveabs") {
    const j = await jd(id), box = root.querySelector(`.ab[data-j="${id}"]`), b = writeBatch(db);
    const base = { siswaId: j.siswaId, guruId: j.guruId, nama_siswa: j.nama_siswa, nama_program: j.nama_program, nama_guru: j.nama_guru, tanggal: j.tanggal };
    b.set(doc(db, "absensi", id), { ...base, jadwalId: id, programId: j.programId, jam_mulai: j.jam_mulai, durasi_menit: j.durasi_menit,
      status: v(box, ".as"), catatan: v(box, ".ac"), dicatat_oleh: ctx.user.uid, dicatat_pada: u });
    const materi = v(box, ".am"), pr = v(box, ".ap");
    if (materi || pr) b.set(doc(db, "catatan_les", id), { ...base, jadwalId: id, materi, pr, pr_tenggat: v(box, ".at"), updated_at: u });
    if (j.status !== "selesai") b.update(doc(db, "jadwal", id), { status: "selesai", updated_at: u });
    await b.commit(); return true;
  }
  if (a === "applyres") {
    const box = root.querySelector(`.rs[data-j="${id}"]`), jenis = v(box, ".rj"), tgl = v(box, ".rd"), jam = v(box, ".rt");
    const g = jenis === "ganti_guru" ? ctx.gurus.find((x) => x.id === box.querySelector(".rg").value) : null;
    if (!tgl || !jam || (jenis === "ganti_guru" && !g)) { alert("Lengkapi tanggal, jam, dan guru pengganti."); return false; }
    await applyResched(await jd(id), jenis, tgl, jam, g, ctx.user.uid); return true;
  }
  if (a === "reqres") {
    const j = await jd(id), box = root.querySelector(`.rq[data-j="${id}"]`);
    if (!v(box, ".qa")) { alert("Tulis alasan pengajuan."); return false; }
    await addDoc(collection(db, "reschedule"), { jadwal_asal_id: id, siswaId: j.siswaId, guruId: j.guruId, programId: j.programId, nama_siswa: j.nama_siswa,
      nama_program: j.nama_program, nama_guru: j.nama_guru, tanggal_asal: j.tanggal, jam_asal: j.jam_mulai, diajukan_oleh: ctx.user.uid, jenis: v(box, ".rj"),
      alasan: v(box, ".qa"), status: "menunggu", guru_pengganti_id: "", nama_guru_pengganti: "", tanggal_baru: v(box, ".rd"), jam_baru: v(box, ".rt"), created_at: u, updated_at: u });
    alert("Pengajuan terkirim."); return true;
  }
  if (a === "approve" || a === "reject") {
    if (a === "reject") { await updateDoc(doc(db, "reschedule", id), { status: "ditolak", disetujui_oleh: ctx.user.uid, updated_at: u }); return true; }
    const r = (await getDoc(doc(db, "reschedule", id))).data(), box = root.querySelector(`.ap2[data-r="${id}"]`);
    const tgl = v(box, ".rd"), jam = v(box, ".rt");
    const g = r.jenis === "ganti_guru" ? ctx.gurus.find((x) => x.id === box.querySelector(".rg").value) : null;
    if (!tgl || !jam || (r.jenis === "ganti_guru" && !g)) { alert("Lengkapi tanggal, jam, dan guru pengganti."); return false; }
    await applyResched(await jd(r.jadwal_asal_id), r.jenis, tgl, jam, g, ctx.user.uid, id); return true;
  }
  return false;
}

let uMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1), uSel = ymd(new Date());
const sec = (title, inner) => `<details class="card sec"><summary>${title}</summary>${inner}</details>`;

// ====== TAMBAHAN: kartu program (dipakai userView & admin) ======
function enrollCard(role, es) {
  if (!es || !es.length) return `<p class="msg">Belum ada data.</p>`;
  return es.map((e) => `<div class="row"><div><strong>${esc(e.nama_program || e.programId)}</strong><br>
    <small>${role === "guru" ? "Siswa: " + esc(e.nama_siswa) : "Guru: " + esc(e.nama_guru)} · status ${esc(e.status || "-")}</small></div>
    <span class="badge ${e.status === "aktif" ? "done" : "wait"}">${esc(e.status || "-")}</span></div>`).join("");
}

async function userView(user, nama, role, p) {
  const fld = role === "guru" ? "guruId" : "siswaId", t = ymd(new Date());
  const ld = async (c) => (await getDocs(query(collection(db, c), where(fld, "==", user.uid)))).docs.map((d) => ({ id: d.id, ...d.data() }));
  const [es, js, ab, ct, rq] = await Promise.all(["siswa_program", "jadwal", "absensi", "catatan_les", "reschedule"].map(ld));
  const A = Object.fromEntries(ab.map((x) => [x.id, x])), C = Object.fromEntries(ct.map((x) => [x.id, x]));
  const key = (j) => j.tanggal + (j.jam_mulai || ""), asc = (a, b) => key(a).localeCompare(key(b)), desc = (a, b) => key(b).localeCompare(key(a));
  const shown = js.filter((j) => j.status === "terjadwal" || j.status === "selesai");
  const who = (j) => role === "guru" ? j.nama_siswa + " · " + j.nama_program : j.nama_program + " · " + j.nama_guru;
  const jam = (j) => j.jam_mulai + "–" + jamAkhir(j.jam_mulai, j.durasi_menit);
  const full = (j, showDate) => `<div class="row" style="display:block">${showDate ? `<strong>${tglLabel(j.tanggal)}</strong> ` : ""}<strong>${jam(j)}</strong> ${esc(who(j))}
    ${j.tipe !== "reguler" ? `<small>(${esc(j.tipe)})</small>` : ""} <span class="badge ${j.status === "selesai" ? "done" : "wait"}">${esc(j.status)}</span><br>${sesiBox(j, role, A, C, [])}</div>`;
  const mini = (j) => `<div class="row"><div><strong>${tglLabel(j.tanggal)}</strong> ${jam(j)}<br><small>${esc(who(j))}</small></div>${j.status === "selesai" ? `<span class="badge done">selesai</span>` : ""}</div>`;
  const reqs = rq.sort((a, b) => (b.created_at ? b.created_at.seconds : 0) - (a.created_at ? a.created_at.seconds : 0)).slice(0, 10);

  const draw = () => {
    const wk0 = monday(new Date()), w0 = ymd(wk0), w1 = ymd(addDays(wk0, 6));
    const hari = js.filter((j) => j.tanggal === t && j.status !== "dibatalkan" && j.status !== "digantikan").sort(asc);
    const late = role === "guru" ? js.filter((j) => j.tanggal < t && j.status === "terjadwal").sort(asc) : [];
    const minggu = shown.filter((j) => j.tanggal >= w0 && j.tanggal <= w1).sort(asc);
    const f = uMonth, l = new Date(f.getFullYear(), f.getMonth() + 1, 0), days = [];
    for (let d = monday(f); d <= addDays(monday(l), 6); d = addDays(d, 1)) days.push(ymd(d));
    const cell = (ds) => {
      const it = shown.filter((j) => j.tanggal === ds).sort(asc), m = Number(ds.slice(5, 7)), d = Number(ds.slice(8));
      return `<button class="cel ${ds === uSel ? "sel" : ""} ${ds === t ? "today" : ""} ${m - 1 !== f.getMonth() ? "out" : ""}" data-ud="${ds}"><b>${d}</b>
        ${it.slice(0, 2).map((j) => `<span class="chip">${j.jam_mulai}</span>`).join("")}${it.length > 2 ? `<span class="chip more">+${it.length - 2}</span>` : ""}</button>`;
    };
    const sel = js.filter((j) => j.tanggal === uSel).sort(asc);
    const hariCard = `<div class="card"><h2>Hari ini</h2><small>${tglLabel(t)}</small>
      ${late.length ? `<p class="msg err">${late.length} sesi sebelumnya belum diabsen:</p>${late.map((j) => full(j, true)).join("")}` : ""}
      ${hari.map((j) => full(j)).join("") || `<p class="msg">Tidak ada kelas hari ini.</p>`}</div>`;
    const mingguCard = `<div class="card"><h2>Minggu ini</h2>${minggu.map(mini).join("") || `<p class="msg">Tidak ada kelas minggu ini.</p>`}</div>`;
    const kal = `<div class="card"><div class="top"><button class="alt sm" data-um="-1">‹</button><h2 style="margin:0">${f.toLocaleDateString("id-ID", { month: "long", year: "numeric" })}</h2><button class="alt sm" data-um="1">›</button></div>
      <div class="cal sm" style="margin-top:12px">${["Sen", "Sel", "Rab", "Kam", "Jum", "Sab", "Min"].map((x) => `<div class="dh">${x}</div>`).join("")}${days.map(cell).join("")}</div>
      <p class="msg"><button class="alt sm" data-um="0">Bulan ini</button> Klik tanggal untuk melihat detail.</p></div>`;
    const detail = `<div class="card"><h2>${tglLabel(uSel)}</h2>${sel.map((j) => full(j)).join("") || `<p class="msg">Tidak ada kelas.</p>`}</div>`;
    let more = sec("Pengajuan reschedule", reqs.map((r) => reqCard(r, role, [])).join("") || `<p class="msg">Belum ada.</p>`);
    if (role === "siswa") {
      more += sec("Catatan les dan PR", ct.sort(desc).slice(0, 10).map((c) => `<div class="row" style="display:block"><strong>${tglLabel(c.tanggal)}</strong><br><small>Materi: ${esc(c.materi) || "-"}<br>PR: ${esc(c.pr) || "-"}${c.pr_tenggat ? " (tenggat " + esc(c.pr_tenggat) + ")" : ""}</small></div>`).join("") || `<p class="msg">Belum ada catatan.</p>`)
        + sec("Riwayat absensi", ab.sort(desc).slice(0, 10).map((x) => `<div class="row"><span>${tglLabel(x.tanggal)} · ${esc(x.nama_program)}</span><span class="badge ${x.status === "hadir" ? "done" : "wait"}">${esc(x.status)}</span></div>`).join("") || `<p class="msg">Belum ada.</p>`);
    }
    more += sec(role === "guru" ? "Siswa saya" : "Program saya", enrollCard(role, es));
    root.innerHTML = topBar(nama, role) + hariCard + mingguCard + kal + detail + (p.exists() ? profileView(role, p.data()) : "") + more;
    $("#out").onclick = () => signOut(auth);
    root.querySelectorAll("[data-um]").forEach((b) => b.onclick = () => {
      const v = Number(b.dataset.um), n = new Date();
      uMonth = v === 0 ? new Date(n.getFullYear(), n.getMonth(), 1) : new Date(uMonth.getFullYear(), uMonth.getMonth() + v, 1);
      if (v === 0) uSel = t;
      draw();
    });
    root.querySelectorAll("[data-ud]").forEach((b) => b.onclick = () => { uSel = b.dataset.ud; draw(); });
    root.querySelectorAll("[data-act]").forEach((b) => b.onclick = async () => {
      b.disabled = true;
      try { if (await sesiAction(b.dataset.act, b.dataset.id, b, { user, role, gurus: [] })) await showHome(user); else b.disabled = false; }
      catch (err) { b.disabled = false; alert(errText(err)); }
    });
  };
  draw();
}

// ====== TAMBAHAN: adminView ======
async function adminView(user, nama) {
  const draw = async () => {
    const [gs, ss, pr, sp, po, rq] = await Promise.all([
      getDocs(collection(db, "guru")),
      getDocs(collection(db, "siswa")),
      getDocs(collection(db, "program")),
      getDocs(collection(db, "siswa_program")),
      getDocs(collection(db, "pola_jadwal")),
      getDocs(query(collection(db, "reschedule"), where("status", "==", "menunggu")))
    ]);
    const gurus = gs.docs.map((d) => ({ id: d.id, ...d.data() }));
    const siswas = ss.docs.map((d) => ({ id: d.id, ...d.data() }));
    const programs = pr.docs.map((d) => ({ id: d.id, ...d.data() }));
    const enrolls = sp.docs.map((d) => ({ id: d.id, ...d.data() }));
    const polas = po.docs.map((d) => ({ id: d.id, ...d.data() }));
    const reqs = rq.docs.map((d) => ({ id: d.id, ...d.data() }));
    const pendingGuru = gurus.filter((g) => g.status_verifikasi === "menunggu");
    const pendingSiswa = siswas.filter((s) => s.status_verifikasi === "menunggu");

    const tab = (id, label) => `<button data-tab="${id}" class="${adminTab === id ? "on" : ""}">${label}</button>`;
    let body = "";

    if (adminTab === "verif") {
      body = `<h2>Menunggu verifikasi</h2>`
        + (pendingGuru.length ? `<h3>Guru</h3>` + pendingGuru.map((g) => `<div class="row"><div><strong>${esc(g.nama_lengkap)}</strong><br><small>${esc(g.no_hp)}</small></div>
            <button class="sm" data-ver="guru" data-id="${g.id}">Verifikasi</button></div>`).join("") : "")
        + (pendingSiswa.length ? `<h3>Siswa</h3>` + pendingSiswa.map((s) => `<div class="row"><div><strong>${esc(s.nama_lengkap)}</strong><br><small>${esc(s.nama_orangtua)} · ${esc(s.no_hp_orangtua)}</small></div>
            <button class="sm" data-ver="siswa" data-id="${s.id}">Verifikasi</button></div>`).join("") : "")
        + (!pendingGuru.length && !pendingSiswa.length ? `<p class="msg">Tidak ada yang menunggu verifikasi.</p>` : "");
    } else if (adminTab === "program") {
      body = `<h2>Program</h2>` + (programs.length ? programs.map((p) => `<div class="row"><div><strong>${esc(p.nama_program)}</strong><br><small>${rp(p.harga || 0)} / bulan · ${p.durasi_menit || 60} menit</small></div></div>`).join("") : `<p class="msg">Belum ada program.</p>`)
        + `<details><summary>Tambah program</summary><div data-newprog>
            <label>Nama program</label><input class="pn"><label>Harga (Rp)</label><input class="ph" type="number">
            <label>Durasi (menit)</label><input class="pd" type="number" value="60">
            <button class="sm" data-act="addprog">Simpan</button></div></details>`;
    } else if (adminTab === "enroll") {
      body = `<h2>Pendaftaran program</h2>`
        + (enrolls.length ? enrolls.map((e) => `<div class="row"><div><strong>${esc(e.nama_siswa)}</strong> · ${esc(e.nama_program)}<br><small>Guru: ${esc(e.nama_guru)} · ${esc(e.status)}</small></div></div>`).join("") : `<p class="msg">Belum ada.</p>`)
        + `<details><summary>Daftarkan siswa ke program</summary><div data-newenroll>
            <label>Siswa</label><select class="es">${siswas.map((s) => `<option value="${s.id}">${esc(s.nama_lengkap)}</option>`).join("")}</select>
            <label>Program</label><select class="ep">${programs.map((p) => `<option value="${p.id}">${esc(p.nama_program)}</option>`).join("")}</select>
            <label>Guru</label><select class="eg">${gurus.map((g) => `<option value="${g.id}">${esc(g.nama_lengkap)}</option>`).join("")}</select>
            <button class="sm" data-act="addenroll">Daftarkan</button></div></details>`;
    } else if (adminTab === "pola") {
      body = `<h2>Pola jadwal</h2>` + (polas.length ? polas.map((p) => `<div class="row"><div><strong>${esc(p.nama_siswa)}</strong> · ${esc(p.nama_program)}<br>
          <small>${esc(p.hari)} ${esc(p.jam_mulai)} · ${esc(p.status)}</small></div>
          ${p.status === "aktif" ? `<button class="alt sm" data-act="closepola" data-id="${p.id}">Hentikan</button>` : ""}</div>`).join("") : `<p class="msg">Belum ada.</p>`)
        + `<button class="sm" data-act="gen">Buat sesi 3 bulan ke depan</button>`;
    } else if (adminTab === "resched") {
      body = `<h2>Pengajuan reschedule</h2>` + (reqs.length ? reqs.map((r) => reqCard(r, "admin", gurus)).join("") : `<p class="msg">Tidak ada pengajuan menunggu.</p>`);
    }

    root.innerHTML = topBar(nama, "admin") + `<div class="tabs">
        ${tab("verif", "Verifikasi")}${tab("program", "Program")}${tab("enroll", "Pendaftaran")}${tab("pola", "Pola jadwal")}${tab("resched", "Reschedule")}
      </div><div class="card">${body}</div>`;
    $("#out").onclick = () => signOut(auth);
    root.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { adminTab = b.dataset.tab; draw(); });
    root.querySelectorAll("[data-ver]").forEach((b) => b.onclick = async () => {
      b.disabled = true;
      try {
        await updateDoc(doc(db, b.dataset.ver, b.dataset.id), { status_verifikasi: "terverifikasi", updated_at: serverTimestamp() });
        await draw();
      } catch (err) { b.disabled = false; alert(errText(err)); }
    });
    root.querySelectorAll("[data-act]").forEach((b) => b.onclick = async () => {
      b.disabled = true;
      try {
        const a = b.dataset.act;
        if (a === "addprog") {
          const box = root.querySelector("[data-newprog]");
          const n = box.querySelector(".pn").value.trim();
          if (!n) { alert("Nama program wajib."); b.disabled = false; return; }
          await addDoc(collection(db, "program"), { nama_program: n, harga: Number(box.querySelector(".ph").value) || 0,
            durasi_menit: Number(box.querySelector(".pd").value) || 60, created_at: serverTimestamp() });
          await draw(); return;
        }
        if (a === "addenroll") {
          const box = root.querySelector("[data-newenroll]");
          const sid = box.querySelector(".es").value, pid = box.querySelector(".ep").value, gid = box.querySelector(".eg").value;
          const s = siswas.find((x) => x.id === sid), p = programs.find((x) => x.id === pid), g = gurus.find((x) => x.id === gid);
          await addDoc(collection(db, "siswa_program"), { siswaId: sid, programId: pid, guruId: gid, nama_siswa: s?.nama_lengkap || "",
            nama_program: p?.nama_program || "", nama_guru: g?.nama_lengkap || "", status: "aktif", created_at: serverTimestamp() });
          await draw(); return;
        }
        if (a === "closepola") { await closePola({ id: b.dataset.id }); await draw(); return; }
        if (a === "gen") { const n = await generate(polas); alert(n + " sesi dibuat."); await draw(); return; }
        if (["approve", "reject"].includes(a)) {
          const ok = await sesiAction(a, b.dataset.id, b, { user, role: "admin", gurus });
          if (ok) await draw(); else b.disabled = false; return;
        }
      } catch (err) { b.disabled = false; alert(errText(err)); }
    });
    root.querySelectorAll("[data-act='saveabs'],[data-act='applyres'],[data-act='reqres']").forEach((b) => b.onclick = async () => {
      b.disabled = true;
      try { const ok = await sesiAction(b.dataset.act, b.dataset.id, b, { user, role: "admin", gurus }); if (ok) await draw(); else b.disabled = false; }
      catch (err) { b.disabled = false; alert(errText(err)); }
    });
  };
  await draw();
}

async function showHome(user) {
  if (busy) return;
  $("#hu").innerHTML = "";
  root.innerHTML = `<div class="card">Memuat…</div>`;
  try {
    const u = await getDoc(doc(db, "users", user.uid));
    if (!u.exists()) {
      root.innerHTML = `<div class="card"><h2>Akun belum lengkap</h2><p>Data akun tidak ditemukan. Hubungi admin.</p><button id="out" class="alt">Keluar</button></div>`;
      $("#out").onclick = () => signOut(auth); return;
    }
    const { role, nama } = u.data();
    if (role === "admin") { await adminView(user, nama); return; }
    const p = await getDoc(doc(db, role, user.uid));
    await userView(user, nama, role, p);
  } catch (e) {
    root.innerHTML = `<div class="card"><h2>Gagal memuat</h2><p class="msg err">${esc(errText(e))}</p><button id="out" class="alt">Keluar</button></div>`;
    $("#out").onclick = () => signOut(auth);
  }
}

onAuthStateChanged(auth, (user) => { if (busy) return; user ? showHome(user) : authView("masuk"); });
</script>
