<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOLIDEO MUSIC COURSE</title>
<style>
:root{--ink:#1d1b2e;--mute:#6b6880;--bg:#f6f4fb;--card:#fff;--line:#e2deee;--brand:#3b2a8c;--brand2:#e8b53a;--ok:#1f7a4d;--err:#b3261e}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,"Times New Roman",serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:var(--brand);color:#fff;padding:18px 20px;border-bottom:4px solid var(--brand2)}
header h1{margin:0;font-size:1.25rem;letter-spacing:.04em}
header small{color:#d6d0f5;font-family:system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:1.2rem}
label{display:block;margin:12px 0 4px;font:600 .9rem system-ui,sans-serif}
input,select,textarea{width:100%;padding:11px;border:1px solid #bdb8d4;border-radius:6px;font:1rem system-ui,sans-serif;background:#fff}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--brand2);outline-offset:1px}
button{font:600 1rem system-ui,sans-serif;border:0;border-radius:6px;padding:11px 18px;cursor:pointer;background:var(--brand);color:#fff;margin-top:16px}
button.alt{background:#fff;color:var(--brand);border:1px solid var(--brand)}
button.sm{margin:0;padding:7px 12px;font-size:.9rem}
.msg{margin-top:12px;font:.95rem system-ui,sans-serif}.err{color:var(--err)}.ok{color:var(--ok)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-family:system-ui,sans-serif}
.row:first-of-type{border-top:0}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font:600 .8rem system-ui,sans-serif}
.wait{background:#fdf0cf;color:#7a5a00}.done{background:#d9f2e4;color:var(--ok)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
dl{margin:0;font-family:system-ui,sans-serif}dt{color:var(--mute);font-size:.85rem;margin-top:10px}dd{margin:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{margin:0;padding:8px 14px;font-size:.9rem;background:#fff;color:var(--brand);border:1px solid var(--brand)}
.tabs button.on{background:var(--brand);color:#fff}
.chk{display:flex;gap:8px;align-items:center;font-weight:400}.chk input{width:auto}
details{margin-top:10px;font-family:system-ui,sans-serif}summary{cursor:pointer;color:var(--brand);font-weight:600}
small{color:var(--mute)}
</style>
</head>
<body>
<header><h1>SOLIDEO MUSIC COURSE</h1><small>Sistem manajemen sekolah musik</small></header>
<main id="app"><div class="card">Memuat…</div></main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, collection, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBzkDez2oSiD6dkpOpn4oHw6GM5E3ioZpk",
  authDomain: "solideo-music-course.firebaseapp.com",
  projectId: "solideo-music-course",
  storageBucket: "solideo-music-course.firebasestorage.app",
  messagingSenderId: "905695709090",
  appId: "1:905695709090:web:5f75bd671c499e6db414fb"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = (s) => document.querySelector(s);
const root = $("#app");
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let busy = false; // true saat proses daftar berlangsung

function errText(e) {
  const m = {
    "auth/invalid-credential": "Email atau password salah.",
    "auth/email-already-in-use": "Email ini sudah terdaftar. Silakan masuk.",
    "auth/weak-password": "Password minimal 6 karakter.",
    "auth/invalid-email": "Format email tidak valid.",
    "auth/network-request-failed": "Tidak ada koneksi internet.",
    "permission-denied": "Akses ditolak oleh aturan keamanan."
  };
  return m[e.code] || ("Terjadi kesalahan: " + (e.code || e.message));
}

function authView(mode = "masuk") {
  const daftar = mode === "daftar";
  root.innerHTML = `
  <div class="card">
    <h2>${daftar ? "Daftar akun baru" : "Masuk"}</h2>
    <form id="f" novalidate>
      ${daftar ? `
      <label for="role">Saya mendaftar sebagai</label>
      <select id="role"><option value="siswa">Siswa (atau orang tua siswa)</option><option value="guru">Guru</option></select>
      <label for="nama">Nama lengkap</label><input id="nama" autocomplete="name">` : ""}
      <label for="email">Email</label><input id="email" type="email" autocomplete="email">
      <label for="pw">Password</label><input id="pw" type="password" autocomplete="${daftar ? "new-password" : "current-password"}">
      ${daftar ? `<div id="extra"></div>` : ""}
      <button type="submit">${daftar ? "Daftar" : "Masuk"}</button>
      <div id="m" class="msg err" role="alert"></div>
    </form>
    <p class="msg">${daftar ? "Sudah punya akun?" : "Belum punya akun?"} <a href="#" id="sw">${daftar ? "Masuk" : "Daftar di sini"}</a></p>
  </div>`;
  $("#sw").onclick = (e) => { e.preventDefault(); authView(daftar ? "masuk" : "daftar"); };
  if (daftar) {
    const draw = () => {
      $("#extra").innerHTML = $("#role").value === "guru"
        ? `<label for="hp">No. HP</label><input id="hp" type="tel">`
        : `<label for="pgl">Nama panggilan siswa</label><input id="pgl">
           <label for="tl">Tanggal lahir siswa</label><input id="tl" type="date">
           <label for="ortu">Nama orang tua</label><input id="ortu">
           <label for="hpo">No. HP orang tua</label><input id="hpo" type="tel">
           <label for="hps">No. HP siswa (boleh kosong)</label><input id="hps" type="tel">
           <label for="almt">Alamat (boleh kosong)</label><input id="almt">`;
    };
    $("#role").onchange = draw; draw();
  }
  $("#f").onsubmit = async (e) => {
    e.preventDefault();
    const m = $("#m"); m.textContent = "";
    const email = $("#email").value.trim(), pw = $("#pw").value;
    try {
      if (!daftar) { await signInWithEmailAndPassword(auth, email, pw); return; }
      const role = $("#role").value, nama = $("#nama").value.trim();
      if (!nama || !email || !pw) { m.textContent = "Nama, email, dan password wajib diisi."; return; }
      let data;
      if (role === "guru") {
        const hp = $("#hp").value.trim();
        if (!hp) { m.textContent = "No. HP wajib diisi."; return; }
        data = { nama_lengkap: nama, no_hp: hp, program_diajarkan: [] };
      } else {
        const v = (id) => $("#" + id).value.trim();
        if (!v("tl") || !v("ortu") || !v("hpo")) { m.textContent = "Tanggal lahir, nama orang tua, dan No. HP orang tua wajib diisi."; return; }
        data = { nama_lengkap: nama, nama_panggilan: v("pgl"), tanggal_lahir: v("tl"), nama_orangtua: v("ortu"),
                 no_hp_orangtua: v("hpo"), no_hp_siswa: v("hps"), alamat: v("almt"), catatan_khusus: "" };
      }
      busy = true;
      const cred = await createUserWithEmailAndPassword(auth, email, pw);
      const uid = cred.user.uid;
      await setDoc(doc(db, "users", uid), { email, role, nama, status: "aktif", created_at: serverTimestamp() });
      await setDoc(doc(db, role, uid), { ...data, uid, status_verifikasi: "menunggu", status: "aktif",
        created_at: serverTimestamp(), updated_at: serverTimestamp() });
      busy = false;
      await showHome(cred.user);
    } catch (err) { busy = false; m.textContent = errText(err); }
  };
}

function profileView(role, p) {
  const f = role === "guru"
    ? [["Nama lengkap", p.nama_lengkap], ["No. HP", p.no_hp]]
    : [["Nama lengkap", p.nama_lengkap], ["Nama panggilan", p.nama_panggilan], ["Tanggal lahir", p.tanggal_lahir],
       ["Nama orang tua", p.nama_orangtua], ["No. HP orang tua", p.no_hp_orangtua], ["No. HP siswa", p.no_hp_siswa], ["Alamat", p.alamat]];
  const ok = p.status_verifikasi === "terverifikasi";
  return `<div class="card">
    <div class="top"><h2>Data saya</h2><span class="badge ${ok ? "done" : "wait"}">${ok ? "Terverifikasi" : "Menunggu verifikasi admin"}</span></div>
    <dl>${f.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v) || "-"}</dd>`).join("")}</dl>
  </div>`;
}

const rp = (n) => "Rp " + Number(n).toLocaleString("id-ID");
const topBar = (nama, role) => `<div class="card top"><div><strong>${esc(nama)}</strong><br><small>${esc(role)}</small></div><button id="out" class="alt sm">Keluar</button></div>`;
let adminTab = "verif";

function enrollCard(role, list) {
  const rows = list.map((e) => `<div class="row"><div><strong>${esc(role === "guru" ? e.nama_siswa : e.nama_program)}</strong><br>
    <small>${role === "guru" ? esc(e.nama_program) : "Guru: " + esc(e.nama_guru)} · ${esc(e.grade_saat_ini) || "grade belum ditentukan"}</small></div>
    <span class="badge ${e.status === "aktif" ? "done" : "wait"}">${esc(e.status)}</span></div>`).join("");
  return `<div class="card"><h2>${role === "guru" ? "Siswa saya" : "Program saya"}</h2>${rows || `<p class="msg">Belum ada.</p>`}</div>`;
}

async function adminView(user, nama) {
  const load = async (c) => (await getDocs(collection(db, c))).docs.map((d) => ({ id: d.id, ...d.data() }));
  const [progs, gurus, siswas, ens] = await Promise.all([load("program"), load("guru"), load("siswa"), load("siswa_program")]);
  const aktif = progs.filter((p) => p.status === "aktif");
  const wait = (x) => x.status_verifikasi === "menunggu";
  const badge = (x) => `<span class="badge ${wait(x) ? "wait" : "done"}">${wait(x) ? "Menunggu" : "Terverifikasi"}</span>`;
  const gradesOf = (p) => p.grade_urutan || Object.keys(p.tarif_per_grade || {});
  const tabs = [["verif", "Verifikasi"], ["program", "Program"], ["guru", "Guru"], ["siswa", "Siswa"]];
  let body = "";

  if (adminTab === "verif") {
    const rows = (col, list) => list.filter(wait).map((x) => `<div class="row"><div><strong>${esc(x.nama_lengkap)}</strong><br>
      <small>${col === "guru" ? esc(x.no_hp) : "Orang tua: " + esc(x.nama_orangtua) + " (" + esc(x.no_hp_orangtua) + ")"}</small></div>
      <button class="sm" data-act="verif" data-col="${col}" data-id="${x.id}">Verifikasi</button></div>`).join("");
    const g = rows("guru", gurus), s = rows("siswa", siswas);
    body = `<div class="card"><h2>Guru menunggu verifikasi</h2>${g || `<p class="msg">Tidak ada.</p>`}</div>
            <div class="card"><h2>Siswa menunggu verifikasi</h2>${s || `<p class="msg">Tidak ada.</p>`}</div>`;
  }

  if (adminTab === "program") {
    body = `<div class="card"><h2>Tambah program</h2><form id="pf" novalidate>
      <label for="pn">Nama program</label><input id="pn" placeholder="Piano Klasik">
      <label for="pd">Durasi sesi (menit)</label><select id="pd"><option>30</option><option>45</option><option selected>60</option></select>
      <label for="pt">Grade dan tarif per bulan (satu baris satu grade)</label>
      <textarea id="pt" rows="5" placeholder="Pemula=250000&#10;Grade 1=300000&#10;Grade 2=350000"></textarea>
      <button type="submit">Simpan program</button><div id="pm" class="msg err" role="alert"></div></form></div>`
      + progs.map((p) => `<div class="card"><div class="top"><div><strong>${esc(p.nama)}</strong><br><small>${p.durasi_standar_menit} menit</small></div>
        <button class="alt sm" data-act="toggleprog" data-id="${p.id}" data-to="${p.status === "aktif" ? "nonaktif" : "aktif"}">${p.status === "aktif" ? "Nonaktifkan" : "Aktifkan"}</button></div>
        ${gradesOf(p).map((k) => `<div class="row"><span>${esc(k)}</span><span>${rp(p.tarif_per_grade[k])}</span></div>`).join("")}</div>`).join("");
  }

  if (adminTab === "guru") {
    body = gurus.map((g) => `<div class="card"><div class="top"><strong>${esc(g.nama_lengkap)}</strong>${badge(g)}</div><small>${esc(g.no_hp)}</small>
      <div data-g="${g.id}"><label>Program yang diajarkan</label>
      ${aktif.map((p) => `<label class="chk"><input type="checkbox" value="${p.id}" ${(g.program_diajarkan || []).includes(p.id) ? "checked" : ""}> ${esc(p.nama)}</label>`).join("") || `<p class="msg">Buat program dulu di tab Program.</p>`}
      <button class="sm" data-act="saveguru" data-id="${g.id}">Simpan</button></div></div>`).join("") || `<div class="card">Belum ada guru yang mendaftar.</div>`;
  }

  if (adminTab === "siswa") {
    body = siswas.map((s) => {
      const mine = ens.filter((e) => e.siswaId === s.id);
      return `<div class="card"><div class="top"><strong>${esc(s.nama_lengkap)}</strong>${badge(s)}</div>
      <small>Orang tua: ${esc(s.nama_orangtua)} (${esc(s.no_hp_orangtua)})</small>
      ${mine.map((e) => `<div class="row"><div>${esc(e.nama_program)} · ${esc(e.nama_guru)}<br><small>${esc(e.grade_saat_ini) || "grade belum ditentukan"} · ${esc(e.status)}</small></div>
        ${e.status === "aktif" ? `<button class="alt sm" data-act="stopenr" data-id="${e.id}">Hentikan</button>` : ""}</div>`).join("")}
      <details><summary>Tambah program</summary><div class="enf" data-s="${s.id}">
        <label>Program</label><select class="ep">${aktif.map((p) => `<option value="${p.id}">${esc(p.nama)}</option>`).join("")}</select>
        <label>Guru</label><select class="eg"></select>
        <label>Grade saat ini</label><select class="er"></select>
        <button class="sm" data-act="addenr" data-id="${s.id}">Simpan</button></div></details></div>`;
    }).join("") || `<div class="card">Belum ada siswa yang mendaftar.</div>`;
  }

  root.innerHTML = topBar(nama, "admin")
    + `<div class="tabs">${tabs.map(([k, t]) => `<button data-tab="${k}" class="${adminTab === k ? "on" : ""}">${t}</button>`).join("")}</div>` + body;
  $("#out").onclick = () => signOut(auth);
  const again = () => showHome(user);
  root.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { adminTab = b.dataset.tab; again(); });

  // isi pilihan guru dan grade sesuai program
  root.querySelectorAll(".enf").forEach((box) => {
    const fill = () => {
      const p = progs.find((x) => x.id === box.querySelector(".ep").value);
      const gs = p ? gurus.filter((g) => (g.program_diajarkan || []).includes(p.id)) : [];
      box.querySelector(".eg").innerHTML = gs.map((g) => `<option value="${g.id}">${esc(g.nama_lengkap)}</option>`).join("") || `<option value="">Belum ada guru untuk program ini</option>`;
      box.querySelector(".er").innerHTML = `<option value="">Belum ditentukan</option>` + (p ? gradesOf(p).map((k) => `<option>${esc(k)}</option>`).join("") : "");
    };
    box.querySelector(".ep").onchange = fill; fill();
  });

  const pf = $("#pf");
  if (pf) pf.onsubmit = async (e) => {
    e.preventDefault();
    const m = $("#pm"); m.textContent = "";
    const nm = $("#pn").value.trim();
    const tarif = {}, urutan = [];
    for (const line of $("#pt").value.split("\n").map((l) => l.trim()).filter(Boolean)) {
      const i = line.lastIndexOf("=");
      const k = line.slice(0, i).trim(), v = Number(line.slice(i + 1).replace(/\D/g, ""));
      if (i < 1 || !k || !v) { m.textContent = `Baris "${line}" salah. Tulis seperti: Grade 1=300000`; return; }
      tarif[k] = v; urutan.push(k);
    }
    if (!nm || !urutan.length) { m.textContent = "Nama program dan minimal satu grade wajib diisi."; return; }
    try {
      await addDoc(collection(db, "program"), { nama: nm, durasi_standar_menit: Number($("#pd").value), tarif_per_grade: tarif, grade_urutan: urutan, status: "aktif" });
      again();
    } catch (err) { m.textContent = errText(err); }
  };

  root.querySelectorAll("[data-act]").forEach((b) => b.onclick = async () => {
    const a = b.dataset.act, id = b.dataset.id;
    b.disabled = true;
    try {
      if (a === "verif") await updateDoc(doc(db, b.dataset.col, id), { status_verifikasi: "terverifikasi", updated_at: serverTimestamp() });
      if (a === "toggleprog") await updateDoc(doc(db, "program", id), { status: b.dataset.to });
      if (a === "stopenr") await updateDoc(doc(db, "siswa_program", id), { status: "berhenti", updated_at: serverTimestamp() });
      if (a === "saveguru") {
        const ids = [...root.querySelectorAll(`[data-g="${id}"] input:checked`)].map((i) => i.value);
        await updateDoc(doc(db, "guru", id), { program_diajarkan: ids, updated_at: serverTimestamp() });
      }
      if (a === "addenr") {
        const box = root.querySelector(`.enf[data-s="${id}"]`);
        const p = progs.find((x) => x.id === box.querySelector(".ep").value);
        const g = gurus.find((x) => x.id === box.querySelector(".eg").value);
        const s = siswas.find((x) => x.id === id);
        if (!p || !g) { alert("Pilih program dan guru. Guru harus diatur dulu di tab Guru."); b.disabled = false; return; }
        await addDoc(collection(db, "siswa_program"), { siswaId: id, programId: p.id, guruId: g.id, nama_siswa: s.nama_lengkap, nama_program: p.nama,
          nama_guru: g.nama_lengkap, grade_saat_ini: box.querySelector(".er").value, status: "aktif",
          tanggal_mulai: new Date().toISOString().slice(0, 10), updated_at: serverTimestamp() });
      }
      again();
    } catch (err) { b.disabled = false; alert(errText(err)); }
  });
}

async function showHome(user) {
  if (busy) return;
  root.innerHTML = `<div class="card">Memuat…</div>`;
  try {
    const u = await getDoc(doc(db, "users", user.uid));
    if (!u.exists()) {
      root.innerHTML = `<div class="card"><h2>Akun belum lengkap</h2><p>Data akun tidak ditemukan. Hubungi admin.</p><button id="out" class="alt">Keluar</button></div>`;
      $("#out").onclick = () => signOut(auth); return;
    }
    const { role, nama } = u.data();
    if (role === "admin") { await adminView(user, nama); return; }
    const p = await getDoc(doc(db, role, user.uid));
    const es = await getDocs(query(collection(db, "siswa_program"), where(role === "guru" ? "guruId" : "siswaId", "==", user.uid)));
    root.innerHTML = topBar(nama, role)
      + (p.exists() ? profileView(role, p.data()) : `<div class="card">Data profil belum ada. Hubungi admin.</div>`)
      + enrollCard(role, es.docs.map((d) => d.data()))
      + `<div class="card"><p class="msg">Jadwal, absensi, dan catatan les menyusul di tahap berikutnya.</p></div>`;
    $("#out").onclick = () => signOut(auth);
  } catch (e) {
    root.innerHTML = `<div class="card"><h2>Gagal memuat</h2><p class="msg err">${esc(errText(e))}</p><button id="out" class="alt">Keluar</button></div>`;
    $("#out").onclick = () => signOut(auth);
  }
}

onAuthStateChanged(auth, (user) => { if (busy) return; user ? showHome(user) : authView("masuk"); });
</script>
</body>
</html>
